name: Fabrication de l'appli

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "signing/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabrication
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupération du code
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Clé de signature
        id: cle
        env:
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          TOUS_LES_SECRETS: ${{ toJSON(secrets) }}
          TOUTES_LES_VARIABLES: ${{ toJSON(vars) }}
        run: |
          if [ -z "${SIGNING_KEY_PASSWORD:-}" ]; then
            # Seuls les NOMS sont affichés, jamais les valeurs.
            secrets=$(echo "$TOUS_LES_SECRETS" | jq -r 'keys | map(select(. != "github_token")) | join(", ")')
            variables=$(echo "$TOUTES_LES_VARIABLES" | jq -r 'keys | join(", ")')
            echo "::warning title=Mot de passe manquant::Secret SIGNING_KEY_PASSWORD introuvable. Secrets vus : [${secrets}]. Variables vues : [${variables}]."
            echo "signature=non" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p signing
          if [ -f signing/keystore.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SIGNING_KEY_PASSWORD \
              -in signing/keystore.enc -out signing/release.jks
          else
            # Toute première fabrication signée : on crée la clé, on la chiffre avec le mot de passe
            # et seule la version chiffrée est enregistrée dans le dépôt.
            keytool -genkeypair -storetype PKCS12 -keystore signing/release.jks -alias courrier \
              -keyalg RSA -keysize 4096 -validity 36500 \
              -dname "CN=Courrier des Nuages, O=Famille, C=FR" \
              -storepass:env SIGNING_KEY_PASSWORD -keypass:env SIGNING_KEY_PASSWORD
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:SIGNING_KEY_PASSWORD \
              -in signing/release.jks -out signing/keystore.enc
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing/keystore.enc
            git commit -m "Clé de signature chiffrée (créée automatiquement)"
            git push origin HEAD:main
          fi
          echo "signature=oui" >> "$GITHUB_OUTPUT"

      - name: Fabrication de l'APK
        env:
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          OPTION_CLE=""
          if [ "${{ steps.cle.outputs.signature }}" = "oui" ]; then
            OPTION_CLE="-PkeystorePath=$GITHUB_WORKSPACE/signing/release.jks"
          fi
          gradle --no-daemon --console=plain assembleRelease \
            -PversionCode=${{ github.run_number }} $OPTION_CLE 2>&1 | tee gradle.log

      - name: Erreurs de fabrication
        if: failure()
        run: |
          if [ ! -s gradle.log ]; then exit 0; fi
          {
            grep -E '^e: |AAPT|error:|ERROR:' gradle.log | grep -v '^[[:space:]]*at ' | head -n 80 || true
            echo "----"
            awk '/What went wrong:/{f=1} f{print} /\* Try:/{f=0}' gradle.log | head -n 60 || true
          } | sed -e "s#file://$GITHUB_WORKSPACE/##g" -e "s#$GITHUB_WORKSPACE/##g" > erreurs.txt
          split -l 12 -d erreurs.txt morceau_
          n=0
          for f in morceau_*; do
            [ -f "$f" ] || continue
            n=$((n+1))
            if [ "$n" -gt 10 ]; then break; fi
            msg=$(awk '{gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", $0}' "$f")
            echo "::error title=Fabrication $n::$msg"
          done

      - name: Publication
        if: steps.cle.outputs.signature == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk courrier-des-nuages.apk
          git log -1 --pretty=%s "$GITHUB_SHA" > notes.txt
          gh release create "v1.$N" courrier-des-nuages.apk \
            --title "Version 1.$N" --notes-file notes.txt --target "$GITHUB_SHA" \
            || gh release upload "v1.$N" courrier-des-nuages.apk --clobber

      - name: Pas de publication sans signature
        if: steps.cle.outputs.signature != 'oui'
        run: |
          echo "::error title=Pas de publication::L'appli se fabrique, mais sans le secret SIGNING_KEY_PASSWORD elle ne peut pas être signée ni publiée."
          exit 1
